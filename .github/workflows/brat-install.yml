name: Verify official BRAT installation
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/brat-install.yml
      - scripts/verify-brat.mjs
permissions:
  contents: read
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Prepare clean Obsidian vault with official BRAT
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/profile" "$RUNNER_TEMP/BRAT Sandbox/.obsidian/plugins/obsidian42-brat"
          cd "$RUNNER_TEMP"
          curl --retry 3 -fsSL https://github.com/obsidianmd/obsidian-releases/releases/download/v1.15.0/obsidian_1.15.0_amd64.deb -o obsidian.deb
          dpkg-deb -x obsidian.deb app
          curl --retry 3 -fsSL https://api.github.com/repos/TfTHacker/obsidian42-brat/releases/tags/2.2.0 -o brat.json
          for file in manifest.json main.js styles.css; do
            url=$(jq -r --arg f "$file" '.assets[]|select(.name==$f)|.browser_download_url' brat.json)
            digest=$(jq -r --arg f "$file" '.assets[]|select(.name==$f)|.digest' brat.json)
            dest="BRAT Sandbox/.obsidian/plugins/obsidian42-brat/$file"
            curl --retry 3 -fsSL "$url" -o "$dest"
            echo "${digest#sha256:}  $dest" | sha256sum -c -
          done
          jq -n --arg path "$RUNNER_TEMP/BRAT Sandbox" '{vaults:{sandbox:{path:$path,open:true,ts:1}}}' > profile/obsidian.json
      - name: Install from repository using Add plugin
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a bash -c '
            "$RUNNER_TEMP/app/opt/Obsidian/obsidian" --no-sandbox --disable-gpu --user-data-dir="$RUNNER_TEMP/profile" --remote-debugging-port=9222 > "$RUNNER_TEMP/obsidian.log" 2>&1 &
            pid=$!
            trap "kill $pid || true" EXIT
            node scripts/verify-brat.mjs
          '
